# nav_config.yaml
# Central configuration for the CBF navigation environment.
# All parameters here are loaded by config.py and consumed by train.py / test.py.

# ─── Environment ──────────────────────────────────────────────────────────────
environment:
  world_size: 10.0          # was: 10.0 — side length of the square arena (meters)
  num_agents: 2             # was: 2    — agents per world; validated for 1-4
  num_obstacles: 2          # was: 3    — static circular obstacles per world
  robot_radius: 0.2         # was: 0.2  — collision radius of each robot (meters)
  obstacle_radius: 0.5      # was: 0.5  — obstacle radius; scalar applies to all
  goal_radius: 0.3          # was: 0.3  — radius of the goal region (meters)
  max_velocity: 1.0         # was: 1.0  — max speed per axis (quasi_static) / max integrated vel (dynamic)
  max_acceleration: 2.0     # was: 2.0  — max acceleration magnitude (dynamic model only)
  dt: 0.05                  # was: 0.05 — simulation timestep (seconds)
  max_episode_steps: 500    # was: 1000 — steps before timeout; 500 × 0.05 s = 25 s sim time
  noise_level: 0.0          # was: 0.0  — gaussian action noise (fraction of max_velocity)

# ─── Dynamics ─────────────────────────────────────────────────────────────────
dynamics:
  # was: quasi_static
  # quasi_static: action = velocity command (single integrator), faster to train
  # dynamic:      action = acceleration (double integrator), more realistic but slower convergence
  model: quasi_static

# ─── CBF Safety ───────────────────────────────────────────────────────────────
cbf:
  use_action_filtering: false  # was: false — hard safety: projects unsafe actions onto the safe set
  use_reward_penalty: false    # was: false — soft safety: penalises the policy for needing correction

# ─── Policy Network ───────────────────────────────────────────────────────────
policy:
  actor_hidden_dims: [64, 64]   # was: [32, 32] — wider to handle larger multi-agent obs
  critic_hidden_dims: [64, 64]  # was: [32, 32]
  activation: relu              # was: relu

# ─── PPO Algorithm ────────────────────────────────────────────────────────────
algorithm:
  gamma: 0.99              # was: 0.99
  lam: 0.95                # was: 0.95
  learning_rate: 3.0e-4    # was: 3.0e-4
  entropy_coef: 0.01       # was: 0.005 — higher to keep exploration up early in multi-agent training
  clip_param: 0.2          # was: 0.2
  num_learning_epochs: 5   # was: 10   — fewer epochs reduces overfitting on short rollouts
  num_mini_batches: 4      # was: 8

# ─── Training Runner ──────────────────────────────────────────────────────────
training:
  seed: 42                 # was: 42
  # num_envs = parallel WORLDS; PPO sees num_envs × num_agents virtual envs
  # 2048 worlds × 2 agents = 4096 virtual envs — same PPO batch size as the old single-agent config
  num_envs: 2048           # was: 4096
  max_iterations: 600      # was: 1500 — enough to see convergence; extend for final runs
  num_steps_per_env: 48    # was: 48
  save_interval: 100       # was: 100
  log_interval: 10         # was: 20   — more frequent to catch early divergence
  run_name: navigation     # was: navigation
  experiment_name: navigation  # was: navigation

# ─── Testing / Evaluation ─────────────────────────────────────────────────────
testing:
  test_episodes: 200       # was: 1000 — enough for a stable success-rate estimate during validation
  render: false            # was: false — set true to watch a single episode
